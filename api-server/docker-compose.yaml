services:
  vire_postgres:
    image: postgres:latest
    container_name: vire_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - vire_postgres_data:/var/lib/postgresql

volumes:
  vire_postgres_data:
